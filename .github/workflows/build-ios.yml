name: Build Personal Cinema iOS App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS App (.ipa & Simulator)
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          echo "Available Xcode installations:"
          ls -d /Applications/Xcode* || true
          if [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          fi
          xcodebuild -version

      - name: Verify Xcode Project
        run: |
          xcodebuild -list -project PersonalCinema.xcodeproj

      - name: Build for Physical iOS Device (ARM64 Unsigned)
        run: |
          xcodebuild build \
            -project PersonalCinema.xcodeproj \
            -scheme PersonalCinema \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath ./DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package .IPA for Sideloading / AltStore / Sideloadly
        run: |
          mkdir -p Payload
          APP_PATH=$(find ./DerivedData/Build/Products/Release-iphoneos -name "PersonalCinema.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: PersonalCinema.app not found in Release-iphoneos"
            exit 1
          fi
          echo "Found app at: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -r PersonalCinema-unsigned.ipa Payload
          ls -lh PersonalCinema-unsigned.ipa

      - name: Build for iOS Simulator
        run: |
          xcodebuild build \
            -project PersonalCinema.xcodeproj \
            -scheme PersonalCinema \
            -configuration Release \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath ./DerivedDataSim \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
          
          SIM_APP_PATH=$(find ./DerivedDataSim/Build/Products/Release-iphonesimulator -name "PersonalCinema.app" -type d | head -n 1)
          if [ -n "$SIM_APP_PATH" ]; then
            cd "$(dirname "$SIM_APP_PATH")"
            zip -r "$GITHUB_WORKSPACE/PersonalCinema-Simulator.zip" PersonalCinema.app
            cd "$GITHUB_WORKSPACE"
          fi

      - name: Upload Downloadable IPA
        uses: actions/upload-artifact@v4
        with:
          name: PersonalCinema-iPhone-IPA
          path: PersonalCinema-unsigned.ipa
          retention-days: 30

      - name: Upload Simulator App
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PersonalCinema-Simulator-App
          path: PersonalCinema-Simulator.zip
          retention-days: 30
